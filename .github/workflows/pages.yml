name: CI/CD - Lugares
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Validar site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check js/script.js
      - run: node scripts/validar-site.mjs
      - name: Preparar arquivos publicáveis
        if: github.event_name == 'push'
        run: |
          mkdir _site
          cp -r index.html css js img _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: _site

  cd:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publicar
